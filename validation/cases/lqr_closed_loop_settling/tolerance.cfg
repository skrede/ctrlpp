# Bounds on ctrlpp's arm only. The Octave dare() arm's operation count is not
# counted, so these bound one side of the comparison, not the pair. The values
# are those examples/embedded/shared/generate_golden.cpp prints, with
# eps = 2^-52 throughout.
#
# K: riccati_roundings(2, 1) = 13036 roundings charged at ||K||_1 = 14.7488:
# 13036 * eps * 14.7488 = 4.27e-11 per entry. The count treats the Riccati
# solve as forward-stable and omits its condition number.
#
# x0_final, x1_final: closed_loop_bound over 201 steps at double, with 3
# roundings per plant entry and the gain row departing by 2 * 4.27e-11:
# 1.54e-13 on the final state's infinity norm.
#
# final_norm: sqrt(2) times that, plus the 3 roundings of the norm itself.
#
# rtol: both arms print 15 digits after the point, half a unit each, and the
# comparator reads each back to the nearest double: 2 * (0.5e-15 + eps / 2).
atol_K_00=4.2691581610231926e-11
rtol_K_00=1.2220446049250314e-15
atol_K_01=4.2691581610231926e-11
rtol_K_01=1.2220446049250314e-15
atol_x0_final=1.5388062006585109e-13
rtol_x0_final=1.2220446049250314e-15
atol_x1_final=1.5388062006585109e-13
rtol_x1_final=1.2220446049250314e-15
atol_final_norm=2.1762005988350806e-13
rtol_final_norm=1.8881784197001253e-15
