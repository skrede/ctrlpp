name: Windows

# Each change is gated ONCE on its way to master rather than twice. The merge
# path is milestone -> develop -> master, and the two triggers below cover it end
# to end with no overlap: a milestone branch is gated on push, entering develop
# is gated by develop's own push, and entering master is gated by the pull
# request into it.
#
# There is deliberately no push trigger for master and no pull-request trigger
# for develop, because each would re-run what the other trigger had just run. A
# pull request is checked out as the MERGE COMMIT and not the branch head, so a
# pull request into master already tests exactly the tree master will have, and
# the push that follows the merge would measure that same tree a second time.
on:
  push:
    branches: [ develop,'milestone/**' ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCTRLPP_BUILD_TESTS=ON `
            -DCTRLPP_BUILD_EXAMPLES=ON `
            -DCTRLPP_CMAKE_FETCH_DEPS=ON `
            -DCTRLPP_INSTALL=OFF `
            '-DCMAKE_CXX_FLAGS=/std:c++latest'

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 30

  install-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Eigen comes from the version this repository pins, read out of the file
      # that pins it, and not from a package manager. vcpkg and Homebrew both
      # serve Eigen 5 now, whose config package refuses a request for 3.4, and
      # what that refusal produces is not a configure failure but a silent
      # fallback to the fetched copy: the cell would then install nothing it
      # could export and would stop testing the system-Eigen route it exists for.
      # vcpkg was here only to supply Eigen, so nothing on this job needs its
      # toolchain file any more.
      #
      # The pin is read under bash because the reader is shared with the other
      # workflows, and the install runs under the default shell so the prefix
      # stays a native path.
      - name: Read the pinned Eigen version
        shell: bash
        run: |
          set -euo pipefail
          declared() {
            awk -v want="$1" -v field="$2" '
              /FetchContent_Declare\($/ { pending = 1; inblock = 0; next }
              pending                   { pending = 0; inblock = ($1 == want); next }
              inblock && $1 == field    { print $2; exit }
              inblock && /^[[:space:]]*\)[[:space:]]*$/ { inblock = 0 }
            ' lib/dependencies.cmake
          }
          REPO=$(declared Eigen3 GIT_REPOSITORY)
          PIN=$(declared Eigen3 GIT_TAG)
          test -n "$REPO" && test -n "$PIN"
          echo "EIGEN_REPO=$REPO" >> "$GITHUB_ENV"
          echo "EIGEN_PIN=$PIN" >> "$GITHUB_ENV"

      - name: Install Eigen at the pinned version
        run: |
          git clone --quiet --depth 1 --branch $env:EIGEN_PIN $env:EIGEN_REPO src-eigen
          cmake -S src-eigen -B src-eigen/build `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps-eigen"
          cmake --install src-eigen/build

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps-eigen" `
            -DCTRLPP_CMAKE_FETCH_DEPS=OFF `
            '-DCMAKE_CXX_FLAGS=/std:c++latest'

      - name: Build and install
        run: |
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Build consumer
        run: |
          cmake tests/integration/consumer -B build-consumer -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps-eigen" `
            '-DCMAKE_CXX_FLAGS=/std:c++latest'
          cmake --build build-consumer --config Release

      - name: Run consumer test
        run: |
          build-consumer/Release/integration_test.exe
