name: Fuzz testing

on:
  push:
    branches: [ master,develop,fuzz,'milestone/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  pull_request:
    branches: [ master,develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCTRLPP_BUILD_FUZZ_TESTS=ON
          -DCTRLPP_CMAKE_FETCH_DEPS=ON

      - name: Build fuzz targets
        run: cmake --build build -j$(nproc)

      - name: Run fuzz targets (smoke test)
        run: |
          # Targets whose oracle is known unsound, with the seed that owns the
          # repair. Exploration is still RUN for these and its outcome is still
          # reported -- an abort does not fail the job, and neither does it
          # disappear. A known-red target that stops aborting is reported as a
          # stale waiver so the list cannot rot into a silent permanent one.
          # That report is deliberately NOT a failure: "the defect you were
          # tracking no longer reproduces in this budget" is not a regression,
          # and making it red would turn budget variance into a spurious red.
          known_red_target() {
            case "$1" in
              fuzz_care) echo "SEED-022 (conditioning-aware oracle bound owed)" ;;
              fuzz_dare) echo "SEED-023 (library and oracle residual bounds disagree by ~400x)" ;;
              *) echo "" ;;
            esac
          }

          failed=0
          stale_waiver=0
          for fuzz in build/tests/fuzz/fuzz_*; do
            [ -x "$fuzz" ] || continue
            name=$(basename "$fuzz")
            echo "--- $name ---"
            rm -f ./crash-* ./oom-*
            # Deterministic gate: replay the curated seeds for the targets that
            # have them. The pass is zero-run so the fuzzer cannot write newly
            # discovered inputs back into the versioned corpus directory, and
            # the exploratory run below is never handed that directory.
            corpus="tests/fuzz/corpus/$name"
            if [ -d "$corpus" ]; then
              echo "replay: $(find "$corpus" -type f | wc -l) curated seed(s)"
              if ! "$fuzz" -runs=0 "$corpus" > ./replay.log 2>&1; then
                echo "FAIL: $name corpus replay"
                tail -20 ./replay.log
                failed=$((failed + 1))
              fi
              rm -f ./replay.log
            fi
            # Exploration budget. At the previous 5s a target that aborts within
            # ~20s passed most runs, so a green job meant "the lottery came up
            # empty" rather than "no input was found". Two fixed seeds plus one
            # seedless pass at 30s each also removes the single-random-seed
            # dependence: a defect reachable from one seed is no longer a coin
            # flip. Worst case is 90s per target; the loop breaks on the first
            # abort, so a red target costs less, not more.
            crashed=0
            for seed_arg in "-seed=1" "-seed=2" ""; do
              # shellcheck disable=SC2086
              timeout 60 "$fuzz" -max_total_time=30 -max_len=1024 $seed_arg > ./explore.log 2>&1 || true
              tail -3 ./explore.log
              # Each glob is tested on its own: `ls ./crash-* ./oom-*` exits
              # non-zero whenever EITHER pattern is unmatched, so the combined
              # form reports "no crash" on a run that produced crash files but
              # no OOM -- which is every abort.
              if ls ./crash-* 1>/dev/null 2>&1 || ls ./oom-* 1>/dev/null 2>&1; then
                crashed=1
                rm -f ./crash-* ./oom-*
                break
              fi
            done
            rm -f ./explore.log
            waiver=$(known_red_target "$name")
            if [ "$crashed" -eq 1 ]; then
              if [ -n "$waiver" ]; then
                echo "KNOWN RED: $name -- $waiver"
              else
                echo "FAIL: $name"
                failed=$((failed + 1))
              fi
            elif [ -n "$waiver" ]; then
              echo "STALE WAIVER: $name is listed known-red for $waiver but did not abort"
              echo "  in this budget. Re-triage and remove it from known_red_target."
              stale_waiver=$((stale_waiver + 1))
            fi
            echo ""
          done
          if [ "$stale_waiver" -gt 0 ]; then
            echo "::warning::$stale_waiver known-red waiver(s) did not reproduce; re-triage them"
          fi
          if [ "$failed" -gt 0 ]; then
            echo "$failed fuzz target(s) crashed"
            exit 1
          fi
