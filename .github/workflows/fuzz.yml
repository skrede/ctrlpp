name: Fuzz testing

# Each change is gated ONCE on its way to master rather than twice. The merge
# path is milestone -> develop -> master, and the two triggers below cover it end
# to end with no overlap: a milestone branch is gated on push, entering develop
# is gated by develop's own push, and entering master is gated by the pull
# request into it.
#
# There is deliberately no push trigger for master and no pull-request trigger
# for develop, because each would re-run what the other trigger had just run. A
# pull request is checked out as the MERGE COMMIT and not the branch head, so a
# pull request into master already tests exactly the tree master will have, and
# the push that follows the merge would measure that same tree a second time.
on:
  push:
    branches: [ develop,fuzz,'milestone/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      # Exploration budget, set by what the run is guarding rather than held
      # fixed. The two integration points -- a pull request into master, and the
      # push that lands work on develop -- are the last cheap places to find a
      # defect, and they get fewer but LONGER passes. These targets are search
      # problems: coverage-guided exploration compounds WITHIN a pass, because
      # the corpus it has built feeds the next mutation, and a fresh pass throws
      # that corpus away. Two passes of 120s therefore reach deeper than four of
      # 30s at the same cost. Work in progress on a milestone branch keeps the
      # shorter, wider setting, which returns faster and still removes the
      # single-seed dependence.
      FUZZ_DEEP: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      # RelWithDebInfo is load-bearing, not housekeeping. This is the only
      # workflow that left CMAKE_BUILD_TYPE unset, and the project defines no
      # default, so the fuzz targets were built with no optimization flags at
      # all. That cost the gate twice over: an unoptimized target explores
      # roughly an order of magnitude fewer inputs per second, and -O0 changes
      # the floating-point intermediates, which puts an entire class of
      # marginal-tolerance defects out of reach by construction. Both Riccati
      # targets abort within thirty seconds at -O2 on the reference host and
      # complete tens of thousands of clean runs at -O0 in this job.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCTRLPP_BUILD_FUZZ_TESTS=ON
          -DCTRLPP_CMAKE_FETCH_DEPS=ON

      - name: Build fuzz targets
        run: cmake --build build -j$(nproc)

      - name: Run fuzz targets (smoke test)
        run: |
          # Targets whose oracle is known unsound, read from the list the local
          # smoke script reads. The rationale lives there, next to the entries,
          # rather than in two places that can disagree about which targets are
          # waived and why.
          known_red_target() {
            awk -v target="$1" '
              /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }
              $1 == target { $1 = ""; sub(/^[[:space:]]+/, ""); print; exit }
            ' tests/fuzz/known_red.txt
          }

          failed=0
          stale_waiver=0
          for fuzz in build/tests/fuzz/fuzz_*; do
            [ -x "$fuzz" ] || continue
            name=$(basename "$fuzz")
            echo "--- $name ---"
            rm -f ./crash-* ./oom-*
            # Deterministic gate: replay the curated seeds for the targets that
            # have them. The pass is zero-run so the fuzzer cannot write newly
            # discovered inputs back into the versioned corpus directory, and
            # the exploratory run below is never handed that directory.
            corpus="tests/fuzz/corpus/$name"
            if [ -d "$corpus" ]; then
              echo "replay: $(find "$corpus" -type f | wc -l) curated seed(s)"
              if ! "$fuzz" -runs=0 "$corpus" > ./replay.log 2>&1; then
                echo "FAIL: $name corpus replay"
                tail -20 ./replay.log
                failed=$((failed + 1))
              fi
              rm -f ./replay.log
            fi
            # Exploration budget. At the previous 5s a target that aborts within
            # ~20s passed most runs, so a green job meant "the lottery came up
            # empty" rather than "no input was found".
            #
            # Every setting keeps at least one FIXED seed and one SEEDLESS pass,
            # and the split is deliberate. A fixed seed makes a red reproducible:
            # rerunning the job runs the same search and finds the same input. A
            # seedless pass draws a new seed every run, so the gate keeps
            # covering ground across runs instead of re-walking one path forever.
            # Neither alone is enough -- fixed seeds only make the same search
            # cheaper to repeat, and a seedless-only gate turns every defect into
            # a coin flip.
            #
            # `none` is the seedless pass; libFuzzer draws its own seed when the
            # flag is absent, which is why it cannot simply be spelled as an
            # empty element of this list.
            if [ "$FUZZ_DEEP" = "true" ]; then
              explore_seconds=120
              explore_seeds="1 none"
            else
              explore_seconds=30
              explore_seeds="1 2 none"
            fi
            crashed=0
            for seed in $explore_seeds; do
              seed_arg=""
              [ "$seed" = "none" ] || seed_arg="-seed=$seed"
              # The wall guard is twice the target's own budget plus a margin, so
              # a target that ignores -max_total_time is still bounded while a
              # slow-starting one is not killed mid-pass.
              # shellcheck disable=SC2086
              timeout $((explore_seconds * 2 + 5)) "$fuzz" \
                -max_total_time="$explore_seconds" -max_len=1024 $seed_arg \
                > ./explore.log 2>&1 || true
              tail -3 ./explore.log
              # Each glob is tested on its own: `ls ./crash-* ./oom-*` exits
              # non-zero whenever EITHER pattern is unmatched, so the combined
              # form reports "no crash" on a run that produced crash files but
              # no OOM -- which is every abort.
              if ls ./crash-* 1>/dev/null 2>&1 || ls ./oom-* 1>/dev/null 2>&1; then
                crashed=1
                rm -f ./crash-* ./oom-*
                break
              fi
            done
            rm -f ./explore.log
            waiver=$(known_red_target "$name")
            if [ "$crashed" -eq 1 ]; then
              if [ -n "$waiver" ]; then
                echo "KNOWN RED: $name -- $waiver"
              else
                echo "FAIL: $name"
                failed=$((failed + 1))
              fi
            elif [ -n "$waiver" ]; then
              echo "STALE WAIVER: $name is listed known-red ($waiver) but did not abort"
              echo "  in this budget. Re-triage at a LARGER budget before removing it from"
              echo "  known_red_target: one of these defects has been reached from a single"
              echo "  seed at four times this budget and from none of them at this one, so a"
              echo "  quiet job is evidence about the budget before it is evidence about the"
              echo "  defect."
              stale_waiver=$((stale_waiver + 1))
            fi
            echo ""
          done
          if [ "$stale_waiver" -gt 0 ]; then
            echo "::warning::$stale_waiver known-red waiver(s) did not reproduce; re-triage them"
          fi
          if [ "$failed" -gt 0 ]; then
            echo "$failed fuzz target(s) crashed"
            exit 1
          fi
