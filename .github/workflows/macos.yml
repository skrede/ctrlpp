name: macOS

# Each change is gated ONCE on its way to master rather than twice. The merge
# path is milestone -> develop -> master, and the two triggers below cover it end
# to end with no overlap: a milestone branch is gated on push, entering develop
# is gated by develop's own push, and entering master is gated by the pull
# request into it.
#
# There is deliberately no push trigger for master and no pull-request trigger
# for develop, because each would re-run what the other trigger had just run. A
# pull request is checked out as the MERGE COMMIT and not the branch head, so a
# pull request into master already tests exactly the tree master will have, and
# the push that follows the merge would measure that same tree a second time.
on:
  push:
    branches: [ develop,'milestone/**' ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # The oldest and newest Xcode the macos-15 image carries, so the stated
      # floor (Xcode 16.0, Apple clang 16) and the current Apple Clang are both
      # built and tested; the step below reports each selection's compiler. The
      # macos-14 image, the last to carry Xcode 15.4, is retired on November 2,
      # 2026 (https://github.com/actions/runner-images/issues/13518).
      matrix:
        xcode: [ "16.0", "26.3" ]
    runs-on: macos-15
    name: build (arm64, Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Report the selected compiler
        run: clang --version

      # The argmin backend's own CMake does find_package(Eigen3); the fetched
      # Eigen below registers no findable Eigen3 package, so that lookup needs
      # an installed one.
      - uses: ./.github/actions/install-pinned-eigen
        with:
          prefix: ${{ github.workspace }}/deps-eigen

      # The backends are on so the solver-backed surface is compiled by Apple
      # Clang. The tree stays the default -fno-exceptions one, which leaves the
      # OSQP- and NLopt-linked unit tests and nmpc_argmin_test, all in the
      # exceptions carve-out, to the Linux backends job.
      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps-eigen \
            -DCTRLPP_BUILD_TESTS=ON \
            -DCTRLPP_BUILD_EXAMPLES=ON \
            -DCTRLPP_BUILD_OSQP=ON \
            -DCTRLPP_BUILD_NLOPT=ON \
            -DCTRLPP_BUILD_ARGMIN=ON \
            -DCTRLPP_CMAKE_FETCH_DEPS=ON \
            -DCTRLPP_INSTALL=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  # The arm64 runner above compiles only the vectorized paths the ARM
  # instruction set selects, so Eigen's SSE and AVX paths would otherwise never
  # be compiled by Apple Clang at all. Xcode 16.0 is the selection shared with
  # the arm64 matrix, so the compiler release is held fixed and the instruction
  # set is what this cell varies.
  build-x86_64:
    strategy:
      fail-fast: false
      matrix:
        xcode: [ "16.0" ]
    # The last x86_64 image the provider offers, supported until August 2027
    # (https://github.com/actions/runner-images/issues/13045). The date is
    # stated so the cell announces its expiry instead of silently disappearing.
    runs-on: macos-15-intel
    name: build (x86_64, Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Report the selected compiler
        run: clang --version

      # The argmin backend's own CMake does find_package(Eigen3); the fetched
      # Eigen below registers no findable Eigen3 package, so that lookup needs
      # an installed one.
      - uses: ./.github/actions/install-pinned-eigen
        with:
          prefix: ${{ github.workspace }}/deps-eigen

      # The backends are on so the solver-backed surface is compiled by Apple
      # Clang. The tree stays the default -fno-exceptions one, which leaves the
      # OSQP- and NLopt-linked unit tests and nmpc_argmin_test, all in the
      # exceptions carve-out, to the Linux backends job.
      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps-eigen \
            -DCTRLPP_BUILD_TESTS=ON \
            -DCTRLPP_BUILD_EXAMPLES=ON \
            -DCTRLPP_BUILD_OSQP=ON \
            -DCTRLPP_BUILD_NLOPT=ON \
            -DCTRLPP_BUILD_ARGMIN=ON \
            -DCTRLPP_CMAKE_FETCH_DEPS=ON \
            -DCTRLPP_INSTALL=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  install-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-pinned-eigen
        with:
          prefix: ${{ github.workspace }}/deps-eigen

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps-eigen \
            -DCTRLPP_CMAKE_FETCH_DEPS=OFF
          cmake --build build
          cmake --install build

      - name: Build consumer
        run: |
          cmake tests/integration/consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps-eigen" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: |
          ./build-consumer/integration_test
