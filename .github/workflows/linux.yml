name: Linux

# Each change is gated ONCE on its way to master rather than twice. The merge
# path is milestone -> develop -> master, and the two triggers below cover it end
# to end with no overlap: a milestone branch is gated on push, entering develop
# is gated by develop's own push, and entering master is gated by the pull
# request into it.
#
# There is deliberately no push trigger for master and no pull-request trigger
# for develop, because each would re-run what the other trigger had just run. A
# pull request is checked out as the MERGE COMMIT and not the branch head, so a
# pull request into master already tests exactly the tree master will have, and
# the push that follows the merge would measure that same tree a second time.
on:
  push:
    branches: [ develop,'milestone/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            coverage: false
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            coverage: true
            gcov_executable: gcov-14
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            coverage: true
            gcov_executable: "llvm-cov-18 gcov"

    runs-on: ubuntu-24.04
    name: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        if: matrix.coverage
        run: pip install gcovr

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="--coverage" \
              -DCMAKE_C_FLAGS="--coverage" \
              -DCTRLPP_BUILD_TESTS=ON \
              -DCTRLPP_BUILD_EXAMPLES=OFF \
              -DCTRLPP_CMAKE_FETCH_DEPS=ON
          else
            cmake . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCTRLPP_BUILD_TESTS=ON \
              -DCTRLPP_BUILD_EXAMPLES=ON \
              -DCTRLPP_CMAKE_FETCH_DEPS=ON
          fi

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Generate coverage
        if: matrix.coverage
        run: |
          gcovr build \
            --root . \
            --gcov-executable "${{ matrix.gcov_executable }}" \
            --filter 'lib/ctrlpp/' \
             \
            --gcov-ignore-errors=source_not_found \
            --xml coverage.xml

      - name: Upload to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Blocking dogfood of the throw-free discipline: ctrlpp's own test targets AND
  # Catch2 compile -fno-exceptions -fno-rtti (CTRLPP_TESTS_WITH_EXCEPTIONS=OFF, the
  # dev preset, Catch2 built with CATCH_CONFIG_DISABLE_EXCEPTIONS). The full ctest
  # -- including the allocation-free no-malloc suite -- runs on this same build, so
  # zero-alloc and no-throw are proven together. No continue-on-error: this gate is
  # blocking.
  no-exceptions:
    runs-on: ubuntu-24.04
    name: no-exceptions (default tree, blocking)

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Line-table-only debug info, overridden here rather than in the preset so
      # that a developer's own Debug build keeps the full variable and type
      # information. What CI needs from debug info is a backtrace with file and
      # line, which -g1 retains; what it does not need is the variable and type
      # description, which is what costs. Measured over this whole tree, that
      # one flag drops the heaviest translation unit from 5.5 to 3.9 GiB, leaves
      # nothing above 4 GiB at all, and cuts total build CPU from 22 to 17
      # minutes. -gsplit-dwarf was measured too and saves 2%; the other debug
      # knobs save nothing.
      - name: Configure (default -fno-exceptions tree)
        run: cmake --preset dev -DCMAKE_CXX_FLAGS_DEBUG=-g1

      # Bounded parallelism, measured rather than chosen. Ninja defaults to
      # nproc+2, which is six slots on these runners; the Makefile-generator
      # jobs get no -j at all and build serially, which is why only the preset
      # jobs ever died. Peak resident set was recorded for every translation
      # unit here: the median is 0.2 GiB, but a handful reach several, and the
      # scheduler converges every slot onto exactly those because the cheap
      # units drain out from under it. Rebuilding that window inside a cgroup
      # capped at the runner's memory reproduced the failure -- kernel OOM kill,
      # surfacing as ninja's "interrupted by user" and a signal exit with no
      # diagnostic, which is the signature that was showing up here.
      #
      # At full -g, six, four and three slots all died and only two survived.
      # With the -g1 above, four, three and two all survive. Three is taken
      # rather than four because at three the worst case is 11.2 GiB summed over
      # the heaviest units, which is under the cap on its own -- so it holds
      # whatever order the scheduler picks, where four survives only because
      # those units do not all peak together.
      - name: Build
        run: cmake --build build/dev -j 3

      - name: Test (runs the allocation-free no-malloc suite)
        run: ctest --test-dir build/dev --output-on-failure

  # Exceptions carve-out: the TUs that genuinely need exceptions (throwing-wrapper
  # assertions via REQUIRE_THROWS*, the [!shouldfail] meta-test) plus every
  # OSQP/NLopt-linked test, with Catch2 exceptions-on.
  exceptions:
    runs-on: ubuntu-24.04
    name: exceptions carve-out (exceptions preset)

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (exceptions preset, OSQP + NLopt on)
        run: cmake --preset exceptions -DCMAKE_CXX_FLAGS_DEBUG=-g1

      # Same measured bound as the no-exceptions job. This tree is heavier
      # still: at full -g it carries fifty translation units above 1 GiB against
      # thirty-four, and twelve above 3 GiB against ten.
      - name: Build
        run: cmake --build build/exceptions -j 3

      - name: Test
        run: ctest --test-dir build/exceptions --output-on-failure

  # The above-floor leg. Library code spells its fallible returns
  # `ctrlpp::expected` and nothing else; what changes with the standard is what
  # that name resolves to, on `expected.h`'s `__cpp_lib_expected` switch. This
  # job exists so the resolution the floor does not select keeps compiling and
  # passing, since a call site that satisfies one resolution can still fail
  # against the other -- the conversion operators the vocabulary type carries
  # only exist on one side of that switch.
  #
  # Until the presets were pinned back to the floor this coverage was
  # accidental and inverted: dev and exceptions were both set to C++23, so the
  # two jobs named as the primary gates were the only ones building above the
  # floor, and neither was testing the standard the library promises.
  cxx23:
    runs-on: ubuntu-24.04
    name: cxx23 (above-floor ctrlpp::expected resolution)

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (default tree at C++23)
        run: cmake --preset dev-cxx23 -DCMAKE_CXX_FLAGS_DEBUG=-g1

      # Same measured bound: this preset builds the same tree as the
      # no-exceptions job, one standard above the floor.
      - name: Build
        run: cmake --build build/dev-cxx23 -j 3

      - name: Test
        run: ctest --test-dir build/dev-cxx23 --output-on-failure

  install-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCTRLPP_CMAKE_FETCH_DEPS=OFF
          cmake --build build
          cmake --install build

      - name: Build consumer project
        run: |
          cmake tests/integration/consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: |
          ./build-consumer/integration_test

  backends:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # The argmin backend's own CMake does find_package(Eigen3); ctrlpp's
      # FETCH_DEPS path downloads Eigen headers directly and never registers a
      # findable Eigen3 package, so the subbuild needs a system Eigen config.
      - name: Install system Eigen for the argmin subbuild
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCTRLPP_BUILD_TESTS=ON \
            -DCTRLPP_BUILD_OSQP=ON \
            -DCTRLPP_BUILD_NLOPT=ON \
            -DCTRLPP_BUILD_ARGMIN=ON \
            -DCTRLPP_TESTS_WITH_EXCEPTIONS=ON \
            -DCTRLPP_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  # Coverage over the tests the default tree cannot build, which is most of the
  # ones that reach the solver-backed headers.
  #
  # The `build` matrix above measures the default no-exceptions tree with no
  # backends, and that tree is a SUBSET of the suite rather than the whole of it:
  # the exceptions carve-out holds 21 unit tests on its own, and the OSQP, NLopt,
  # argmin and property blocks are gated behind build options that matrix does
  # not set. Those tests were never deleted and they still run -- the `backends`
  # job above and the backends sanitizer cell below both run them -- but nothing
  # was MEASURING them, so every line they alone reach was reported as uncovered.
  # The effect is concentrated rather than spread: it is why the mpc and mhe
  # directories read far below the rest, and one of the excluded targets is
  # named mpc_coverage_test.
  #
  # This job exists rather than the flags being added to the matrix above so the
  # cheap default-tree signal stays cheap and keeps its own meaning: that matrix
  # answers "what does the shipped no-exceptions configuration cover", which is
  # worth knowing on its own. Codecov merges the reports uploaded for a commit,
  # which is already how the two cells of that matrix combine, so the union is
  # what lands.
  coverage-backends:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      # The argmin backend's own CMake does find_package(Eigen3); ctrlpp's
      # FETCH_DEPS path downloads Eigen headers directly and never registers a
      # findable Eigen3 package, so the subbuild needs a system Eigen config.
      - name: Install system Eigen for the argmin subbuild
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      # The compiler is pinned rather than left to the image default, because
      # gcov reads notes written by the compiler that produced them and the
      # generate step below calls gcov-14 by name. An image default of gcc-13
      # would emit notes gcov-14 cannot read, and the report would come back
      # empty rather than wrong -- which merges into Codecov as no change at all
      # and would leave this job looking green while measuring nothing.
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCTRLPP_BUILD_TESTS=ON \
            -DCTRLPP_BUILD_EXAMPLES=OFF \
            -DCTRLPP_BUILD_OSQP=ON \
            -DCTRLPP_BUILD_NLOPT=ON \
            -DCTRLPP_BUILD_ARGMIN=ON \
            -DCTRLPP_TESTS_WITH_EXCEPTIONS=ON \
            -DCTRLPP_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      # The same filter the matrix above uses, so the two reports describe the
      # same line set and merge rather than talk past each other.
      - name: Generate coverage
        run: |
          gcovr build \
            --root . \
            --gcov-executable gcov-14 \
            --filter 'lib/ctrlpp/' \
            --gcov-ignore-errors=source_not_found \
            --xml coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Sanitizers over the unit suite, following the house pattern (see argmin and
  # cartan, whose asan-ubsan jobs this mirrors). ctrlpp needs two cells rather
  # than one: the solver backends are a separate build tree, and the default
  # tree does not compile them at all. That gap is not hypothetical -- an OSQP
  # setup-failure leak survived in a path the existing suite already exercised,
  # because no build had the instrumentation to see it.
  #
  # Unlike a local triage sweep, this deliberately omits -fsanitize-recover so a
  # UBSan report aborts the test rather than being logged while ctest still
  # reports a pass.
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan (core)
            backends: false
          - name: asan-ubsan (backends)
            backends: true

    runs-on: ubuntu-24.04
    name: sanitize (${{ matrix.name }})

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - uses: actions/checkout@v4

      # Same reason as the backends job: the FETCH_DEPS path downloads Eigen
      # headers directly and never registers a findable Eigen3 package, so the
      # argmin subbuild needs a system Eigen config.
      - name: Install system Eigen for the argmin subbuild
        if: matrix.backends
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Configure
        run: |
          set -euo pipefail
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          if [ "${{ matrix.backends }}" = "true" ]; then
            EXTRA="-DCTRLPP_BUILD_OSQP=ON -DCTRLPP_BUILD_NLOPT=ON -DCTRLPP_BUILD_ARGMIN=ON -DCTRLPP_TESTS_WITH_EXCEPTIONS=ON -DCTRLPP_BUILD_PROPERTY_TESTS=ON"
          else
            EXTRA=""
          fi
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$SAN" \
            -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN" \
            -DCTRLPP_BUILD_TESTS=ON \
            -DCTRLPP_CMAKE_FETCH_DEPS=ON \
            $EXTRA

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: "detect_leaks=1"
          UBSAN_OPTIONS: "print_stacktrace=1"
        run: cd build && ctest --output-on-failure

  # MemorySanitizer requires the ENTIRE program -- including the C++ standard
  # library -- to be instrumented. Stock libstdc++ is not, which produces false
  # use-of-uninitialized reports deep inside std:: containers (e.g. in Catch2's
  # registry during static init). We build libc++/libc++abi with
  # -fsanitize=memory and link against them so the reports are real signal.
  # This recipe, and the unwinder defect it works around, come from argmin's
  # sanitize-msan job.
  #
  # The unwinder is deliberately NOT instrumented: an MSAN-built libunwind reads
  # its own register context (getReg) in a way MSAN treats as uninitialized,
  # which (a) false-positives on every ordinary C++ exception unwind and (b)
  # infinitely recurses -- and SIGSEGVs -- when MSAN unwinds to print a real
  # report, masking the finding. So libc++abi is pointed at the platform
  # unwinder (LIBCXXABI_USE_LLVM_UNWINDER=OFF, uninstrumented libgcc_s) and
  # fast_unwind_on_fatal keeps MSAN's own fatal traces off libunwind too.
  #
  # This runs the CORE tree only, deliberately. MSan reports uninitialized
  # reads wherever they occur, including inside the vendored C sources of the
  # solver backends (OSQP, NLopt), which ctrlpp cannot fix and which would make
  # the gate red for reasons outside this repository. The core tree is ctrlpp's
  # own headers plus Eigen and Catch2, all built from source and instrumented --
  # and it is where the uninitialized-read class of defect actually lives:
  # moesp returned indeterminate matrices on its failure paths, which ASan is
  # structurally unable to observe.
  sanitize-msan:
    runs-on: ubuntu-24.04
    name: sanitize (msan, instrumented libc++)

    env:
      LLVM_VER: "18.1.8"          # track the clang used below (clang-18)
      CC: clang-18
      CXX: clang++-18
      LIBCXX_MSAN: ${{ github.workspace }}/libcxx-msan

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 ninja-build cmake xz-utils

      # The instrumented libc++ is expensive to build (~10 min) but fully
      # deterministic for a fixed LLVM version + compiler, so cache it.
      - name: Cache instrumented libc++
        id: cache-libcxx
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBCXX_MSAN }}
          key: libcxx-msan-llvm${{ env.LLVM_VER }}-clang18-ubuntu24-v1

      - name: Build instrumented libc++
        if: steps.cache-libcxx.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/llvm-project-${LLVM_VER}.src.tar.xz"
          tar xf "llvm-project-${LLVM_VER}.src.tar.xz"
          cmake -G Ninja \
            -S "llvm-project-${LLVM_VER}.src/runtimes" \
            -B build-libcxx-msan \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" \
            -DLLVM_USE_SANITIZER=MemoryWithOrigins \
            -DLIBCXXABI_USE_LLVM_UNWINDER=OFF \
            -DLIBCXX_INCLUDE_TESTS=OFF \
            -DLIBCXX_INCLUDE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX="${LIBCXX_MSAN}"
          ninja -C build-libcxx-msan cxx cxxabi
          ninja -C build-libcxx-msan install-cxx install-cxxabi

      - name: Configure
        run: |
          set -euo pipefail
          MSAN="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer -g"
          # Point compile + link at OUR instrumented libc++, and set rpath so
          # the test binary loads it at runtime (test discovery runs the
          # binary -- that is the step that crashes with stock libstdc++).
          CXX_FLAGS="$MSAN -stdlib=libc++ -nostdinc++ -isystem ${LIBCXX_MSAN}/include/c++/v1"
          LINK_FLAGS="$MSAN -stdlib=libc++ -L${LIBCXX_MSAN}/lib -Wl,-rpath,${LIBCXX_MSAN}/lib -lc++abi"
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="$CXX_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LINK_FLAGS" \
            -DCTRLPP_BUILD_TESTS=ON \
            -DCTRLPP_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          # fast_unwind_on_fatal keeps MSAN's fatal-report unwinding on frame
          # pointers (-fno-omit-frame-pointer is set) rather than libunwind.
          MSAN_OPTIONS: "abort_on_error=1 fast_unwind_on_fatal=1"
        run: cd build && ctest --output-on-failure
